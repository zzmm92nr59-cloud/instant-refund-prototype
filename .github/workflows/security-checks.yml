name: Security checks
# Rate limits, input checks, who can do what, and no keys in the repository (docs/SECURITY.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No keys, tokens or private keys in the repository
        run: node scripts/check-secrets.mjs
      - name: Input checks and rate limits on every route
        run: node scripts/test-validation.mjs
      - name: Who can do what (visitors, shoppers, admins, shops, webhooks)
        run: node scripts/test-access-control.mjs
      - name: Relay health shows counts only (admins only, shops named from 3 people)
        run: node scripts/test-health.mjs
      - name: Help chat (nothing from anyone's email goes to the AI company; limits; a person by email)
        run: node scripts/test-support-chat.mjs
      - name: Relay health by email (admins only, counts only, alerts at most every 6 hours)
        run: node scripts/test-health-digest.mjs
      - name: Shops as the answer key (a shop's order checked only against its own shopper's receipts; counts only)
        run: node scripts/test-answer-key.mjs
      - name: Emails sent to Relay (the shopper sees the copy first, details hidden, encrypted, admins only and recorded, deleted on time)
        run: node scripts/test-shared-emails.mjs
      - name: AI help (off until the key and the shopper's switch, personal details hidden, answers checked, gaps only, deleted when off)
        run: node scripts/test-ai-reader.mjs
      - name: AI spending (a monthly and a daily limit checked before every call, every feature falls back, nothing sent twice)
        run: node scripts/test-ai-spend.mjs
      - name: AI for picks (item names only, opt-in)
        run: node scripts/test-item-kinds.mjs
      - name: Open banking (read-only, team and testers on test banks)
        run: node scripts/test-bank.mjs
      - name: Receipt photos (which payments likely need a receipt, own payments only, checked photos, nothing invented, mismatches shown)
        run: node scripts/test-receipt-photo.mjs
      - name: Shop directory (seed list, TrueLayer's labels, shops learned from two shoppers' receipts, nothing about anyone kept)
        run: node scripts/test-shop-directory.mjs
      - name: Picks follow what a thing is (a Jordan backpack is a bag, heel balm isn't heels, the weekly shop picks nothing)
        run: node scripts/test-picks-kinds.mjs
      - name: Live parcel tracking (off until the key is set, tracking number only, 10 new parcels a month)
        run: node scripts/test-parcel-tracking.mjs
      - name: Return tracking (emails matched to the shopper's own receipt only, typed numbers, carrier guessed only when sure, refund not seen at 14 days, Ship24 shares the allowance, own receipts only)
        run: node scripts/test-return-tracking.mjs
      - name: Codes to show or scan (found only where the email says what they are for; the picture fetched with nothing of the shopper's; the owner only; deleted with the mail data)
        run: node scripts/test-scan-codes.mjs
      - name: Auctions (proxy bids, nobody sees who bid, the winner's unpaid order at the shop, 24 hours to pay, then the next bidder)
        run: node scripts/test-auctions.mjs
      - name: Interests (kept with the account, only ids on the list, each account its own, shops' categories never guessed)
        run: node scripts/test-interests.mjs
      - name: First-run tips seen (kept with the account, only ids on the list, each account its own, exported and deleted with it)
        run: node scripts/test-tips.mjs
      - name: Shopping bag (owner only, Relay's own products only and never test shops', prices checked at the shop's storefront, exported and deleted with the account)
        run: node scripts/test-bag.mjs
      - name: Relay's team searching their own Outlook inbox (team only, own inbox only, read-only, Outlook busy, limits)
        run: node scripts/test-outlook-search.mjs
      - name: Google and Microsoft sign-in can only be finished by the person who signed in (a sign-in started by someone else can't be claimed, and connects no inbox)
        run: node scripts/test-signin-claim.mjs
      - name: Two-step sign-in (sessions from before the second step are ended; the first second step signs other devices out)
        run: node scripts/test-second-step.mjs
      - name: Public Shopify status gives counts only (no shop address, order counts or error text)
        run: node scripts/test-shopify-status.mjs
      - name: Shopify and Square webhooks (bodies capped before any signature work, exact-byte signatures, counted per address)
        run: node scripts/test-webhook-limits.mjs
