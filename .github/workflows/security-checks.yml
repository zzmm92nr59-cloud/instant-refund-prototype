name: Security checks
# Rate limits, input checks, who can do what, and no keys in the repository (docs/SECURITY.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No keys, tokens or private keys in the repository
        run: node scripts/check-secrets.mjs
      - name: Input checks and rate limits on every route
        run: node scripts/test-validation.mjs
      - name: Who can do what (visitors, shoppers, admins, shops, webhooks)
        run: node scripts/test-access-control.mjs
      - name: Relay health shows counts only (admins only, shops named from 3 people)
        run: node scripts/test-health.mjs
      - name: Help chat (nothing from anyone's email goes to the AI company; limits; a person by email)
        run: node scripts/test-support-chat.mjs
      - name: Relay health by email (admins only, counts only, alerts at most every 6 hours)
        run: node scripts/test-health-digest.mjs
      - name: Shops as the answer key (a shop's order checked only against its own shopper's receipts; counts only)
        run: node scripts/test-answer-key.mjs
      - name: Emails sent to Relay (the shopper sees the copy first, details hidden, encrypted, admins only and recorded, deleted on time)
        run: node scripts/test-shared-emails.mjs
      - name: AI help (off until the key and the shopper's switch, personal details hidden, answers checked, gaps only, deleted when off)
        run: node scripts/test-ai-reader.mjs
      - name: Auctions (proxy bids, nobody sees who bid, the winner's unpaid order at the shop, 24 hours to pay, then the next bidder)
        run: node scripts/test-auctions.mjs
      - name: Interests (kept with the account, only ids on the list, each account its own, shops' categories never guessed)
        run: node scripts/test-interests.mjs
