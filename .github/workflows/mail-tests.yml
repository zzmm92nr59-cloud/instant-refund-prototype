name: Email reading (Gmail and Outlook)
# Every change to how emails are read is tested on both kinds of mailbox before it's merged, and Gmail and Outlook must
# give the same receipts (see scripts/test-mail-parity.mjs).
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'scripts/test-mail-parity.mjs'
      - 'scripts/test-gmail*.mjs'
      - 'scripts/test-outlook*.mjs'
      - 'scripts/test-receipt-*.mjs'
      - 'scripts/test-wrapped.mjs'
      - 'scripts/test-wrapped-better.mjs'
      - 'scripts/test-wrapped-journeys.mjs'
      - 'scripts/test-flights.mjs'
      - 'scripts/fixtures/flight-emails.mjs'
      - 'scripts/fixtures/receipt-emails/**'
      - 'scripts/fixtures/receipt-coverage/**'
      - 'scripts/test-item-kinds-accuracy.mjs'
      - 'scripts/test-item-kinds-corpus.mjs'
      - 'scripts/fixtures/uk-receipt-lines.json'
      - 'scripts/fixtures/corpus-item-kinds.json'
      - 'scripts/fixtures/item-names-wrong.json'
      - 'scripts/test-item-names.mjs'
      - 'scripts/test-delete-account.mjs'
      - 'scripts/test-more-inboxes.mjs'
      - 'scripts/test-return-policies.mjs'
      - 'scripts/test-gifts.mjs'
      - 'scripts/test-mail-push.mjs'
      - 'scripts/test-scan-codes.mjs'
      - 'scripts/fixtures/scan-codes.mjs'
      - '.github/workflows/mail-tests.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/test-mail-parity.mjs'
      - 'scripts/test-gmail*.mjs'
      - 'scripts/test-outlook*.mjs'
      - 'scripts/test-receipt-*.mjs'
      - 'scripts/test-wrapped.mjs'
      - 'scripts/test-wrapped-better.mjs'
      - 'scripts/test-wrapped-journeys.mjs'
      - 'scripts/test-flights.mjs'
      - 'scripts/fixtures/flight-emails.mjs'
      - 'scripts/fixtures/receipt-emails/**'
      - 'scripts/fixtures/receipt-coverage/**'
      - 'scripts/test-item-kinds-accuracy.mjs'
      - 'scripts/test-item-kinds-corpus.mjs'
      - 'scripts/fixtures/uk-receipt-lines.json'
      - 'scripts/fixtures/corpus-item-kinds.json'
      - 'scripts/fixtures/item-names-wrong.json'
      - 'scripts/test-item-names.mjs'
      - 'scripts/test-delete-account.mjs'
      - 'scripts/test-more-inboxes.mjs'
      - 'scripts/test-return-policies.mjs'
      - 'scripts/test-gifts.mjs'
      - 'scripts/test-mail-push.mjs'
      - 'scripts/test-scan-codes.mjs'
      - 'scripts/fixtures/scan-codes.mjs'
      - '.github/workflows/mail-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reading receipts (items, shop names, groups, forwarded emails)
        run: |
          node scripts/test-receipt-parser.mjs
          node scripts/test-receipt-corpus.mjs
          node scripts/test-receipt-coverage.mjs
          node scripts/test-item-names.mjs
          node scripts/test-inbox-simulation.mjs
          node scripts/test-receipt-reread.mjs
          node scripts/test-receipt-reader.mjs
          node scripts/test-receipt-category.mjs
          node scripts/test-wrapped.mjs
          node scripts/test-wrapped-better.mjs
          node scripts/test-wrapped-journeys.mjs
          node scripts/test-flights.mjs
      - name: What each receipt line is (Relay's rules alone, over 1,000 made-up UK receipt lines; at least 97% right, and food never read as clothes, shoes, bags, tech or homeware or the other way round)
        run: node scripts/test-item-kinds-accuracy.mjs
      - name: What each item in the receipt corpus is (read with its own shop; at least 98% right, never food as a kept thing or the other way round; supermarkets grocery-first)
        run: node scripts/test-item-kinds-corpus.mjs
      - name: Gmail
        run: |
          node scripts/test-gmail.mjs
          node scripts/test-gmail-auto.mjs
          node scripts/test-gmail-busy.mjs
          node scripts/test-gmail-big-email.mjs
          node scripts/test-gmail-year-round.mjs
          node scripts/test-delete-account.mjs
      - name: More than one inbox (Gmail and Outlook together)
        run: node scripts/test-more-inboxes.mjs
      - name: Outlook
        run: |
          node scripts/test-outlook.mjs
          node scripts/test-outlook-throttle.mjs
      - name: Gmail and Outlook give the same receipts, cards and Wrapped
        run: node scripts/test-mail-parity.mjs
      - name: Instant email (Gmail notices signed by Google, Outlook notices with their secret; set-up, renewal, disconnecting)
        run: node scripts/test-mail-push.mjs
      - name: Shops' own returns policies (complete, recent, used only when the emails give no date)
        run: node scripts/test-return-policies.mjs
      - name: Gifts (tagging receipts, who for, Wrapped, own receipts only)
        run: node scripts/test-gifts.mjs
      - name: Codes to show or scan (a return barcode, a drop-off QR code, a collection, tickets; look-alikes never; as sent and forwarded)
        run: node scripts/test-scan-codes.mjs
      - name: Fix this receipt (shop, total, date, items; own receipts only; counted for Relay health)
        run: node scripts/test-receipt-fixes.mjs
