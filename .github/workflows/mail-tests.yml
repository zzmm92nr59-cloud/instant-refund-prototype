name: Email reading (Gmail and Outlook)
# Every change to how emails are read is tested on both kinds of mailbox before it's merged, and Gmail and Outlook must
# give the same receipts (see scripts/test-mail-parity.mjs).
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'scripts/test-mail-parity.mjs'
      - 'scripts/test-gmail*.mjs'
      - 'scripts/test-outlook*.mjs'
      - 'scripts/test-receipt-*.mjs'
      - 'scripts/test-wrapped.mjs'
      - 'scripts/test-delete-account.mjs'
      - 'scripts/test-more-inboxes.mjs'
      - 'scripts/test-return-policies.mjs'
      - 'scripts/test-gifts.mjs'
      - '.github/workflows/mail-tests.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/test-mail-parity.mjs'
      - 'scripts/test-gmail*.mjs'
      - 'scripts/test-outlook*.mjs'
      - 'scripts/test-receipt-*.mjs'
      - 'scripts/test-wrapped.mjs'
      - 'scripts/test-delete-account.mjs'
      - 'scripts/test-more-inboxes.mjs'
      - 'scripts/test-return-policies.mjs'
      - 'scripts/test-gifts.mjs'
      - '.github/workflows/mail-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reading receipts (items, shop names, groups, forwarded emails)
        run: |
          node scripts/test-receipt-parser.mjs
          node scripts/test-receipt-reader.mjs
          node scripts/test-receipt-category.mjs
          node scripts/test-wrapped.mjs
      - name: Gmail
        run: |
          node scripts/test-gmail.mjs
          node scripts/test-gmail-auto.mjs
          node scripts/test-gmail-busy.mjs
          node scripts/test-delete-account.mjs
      - name: More than one inbox (Gmail and Outlook together)
        run: node scripts/test-more-inboxes.mjs
      - name: Outlook
        run: |
          node scripts/test-outlook.mjs
          node scripts/test-outlook-throttle.mjs
      - name: Gmail and Outlook give the same receipts, cards and Wrapped
        run: node scripts/test-mail-parity.mjs
      - name: Shops' own returns policies (complete, recent, used only when the emails give no date)
        run: node scripts/test-return-policies.mjs
      - name: Gifts (tagging receipts, who for, Wrapped, own receipts only)
        run: node scripts/test-gifts.mjs
      - name: Fix this receipt (shop, total, date, items; own receipts only; counted for Relay health)
        run: node scripts/test-receipt-fixes.mjs
