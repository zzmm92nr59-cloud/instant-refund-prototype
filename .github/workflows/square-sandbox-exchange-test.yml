name: Square Sandbox exchange payment and partial refund proof
on:
  workflow_dispatch:
jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create sandbox replacement orders, extra payment, and partial refund
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: node scripts/square-sandbox-exchange-test.mjs
