name: Sign-in and security
# Sign-in, two-step sign-in, phone numbers, passkeys and the security emails are tested before a change is merged
# (the same tests run again before the Worker is deployed).
on:
  pull_request:
    paths:
      - 'worker/auth.js'
      - 'worker/totp.js'
      - 'worker/phone.js'
      - 'worker/passkeys.js'
      - 'worker/security-mail.js'
      - 'worker/migrations/**'
      - 'scripts/test-auth.mjs'
      - 'scripts/test-security-mail.mjs'
      - '.github/workflows/sign-in-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sign-in, two-step sign-in, phone numbers and passkeys
        run: node scripts/test-auth.mjs
      - name: Security emails and signing out other devices
        run: node scripts/test-security-mail.mjs
