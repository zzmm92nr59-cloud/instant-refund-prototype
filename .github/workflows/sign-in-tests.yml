name: Sign-in and security
# Sign-in, two-step sign-in, phone numbers, passkeys, the security emails and the reviewer sign-in are tested before a change is merged
# (the same tests run again before the Worker is deployed).
on:
  pull_request:
    paths:
      - 'worker/auth.js'
      - 'worker/totp.js'
      - 'worker/phone.js'
      - 'worker/passkeys.js'
      - 'worker/security-mail.js'
      - 'worker/review-account.js'
      - 'worker/phone-signin.js'
      - 'worker/second-step.js'
      - 'scripts/test-signin-claim.mjs'
      - 'scripts/test-second-step.mjs'
      - 'scripts/test-phone-signin.mjs'
      - 'worker/migrations/**'
      - 'scripts/test-auth.mjs'
      - 'scripts/test-security-mail.mjs'
      - 'scripts/test-review-account.mjs'
      - '.github/workflows/sign-in-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sign-in, two-step sign-in, phone numbers and passkeys
        run: node scripts/test-auth.mjs
      - name: Google and Microsoft sign-in can only be finished by the person who signed in
        run: node scripts/test-signin-claim.mjs
      - name: Two-step sign-in for everyone
        run: node scripts/test-second-step.mjs
      - name: Security emails and signing out other devices
        run: node scripts/test-security-mail.mjs
      - name: Approving a sign-in from a phone
        run: node scripts/test-phone-signin.mjs
      - name: Sign-in for app reviewers
        run: node scripts/test-review-account.mjs
      - name: Profile - name and photo rules, a photo that is too big is refused plainly
        run: node scripts/test-profile.mjs
