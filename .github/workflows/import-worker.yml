name: Import Relay Worker from Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and extract Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p worker

          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output /tmp/relay-worker-response \
            --dump-header /tmp/relay-worker-headers \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/relay-square-api2"

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default

          headers = Path("/tmp/relay-worker-headers").read_text()
          body = Path("/tmp/relay-worker-response").read_bytes()

          types = re.findall(
              r"^content-type:\s*(.+)$",
              headers,
              flags=re.IGNORECASE | re.MULTILINE,
          )

          if not types:
              raise SystemExit("Missing Content-Type header")

          content_type = types[-1].strip()

          if not content_type.lower().startswith("multipart/form-data"):
              if not (
                  "javascript" in content_type.lower()
                  or "ecmascript" in content_type.lower()
                  or "text/plain" in content_type.lower()
              ):
                  raise SystemExit(
                      f"Unexpected response type: {content_type}"
                  )

              Path("worker/worker.js").write_bytes(body)
              print("Imported single-file Worker")
          else:
              prefix = (
                  f"Content-Type: {content_type}\r\n"
                  "MIME-Version: 1.0\r\n\r\n"
              ).encode()

              message = BytesParser(
                  policy=default
              ).parsebytes(prefix + body)

              if not message.is_multipart():
                  raise SystemExit(
                      "Cloudflare multipart response could not be parsed"
                  )

              metadata = None
              scripts = []

              for part in message.iter_parts():
                  name = part.get_param(
                      "name",
                      header="content-disposition",
                  )
                  data = part.get_payload(decode=True)

                  if name == "metadata":
                      metadata = json.loads(data)
                  elif name and data is not None:
                      scripts.append((name, data))

              if not isinstance(metadata, dict):     print("Multipart part names:", [name for name, _ in scripts])     raise SystemExit("Worker metadata missing")
                  raise SystemExit("Worker metadata missing")

              main = (
                  metadata.get("main_module")
                  or metadata.get("body_part")
              )

              matches = [
                  data for name, data in scripts
                  if name == main
              ]

              if not main or len(matches) != 1:
                  raise SystemExit(
                      "Cannot identify unique Worker entrypoint"
                  )

              if len(scripts) != 1:
                  raise SystemExit(
                      "Worker has multiple modules. "
                      "Import stopped to prevent data loss."
                  )

              Path("worker/worker.js").write_bytes(matches[0])
              print(f"Extracted Worker entrypoint: {main}")
          PY

          test -s worker/worker.js
          node --check worker/worker.js

          if grep -Eq 'sq0atp-|plaid-secret-|-----BEGIN (RSA |EC )?PRIVATE KEY-----' worker/worker.js; then
            echo "Potential hardcoded credential detected."
            exit 1
          fi

          echo "Worker extraction and syntax check passed."

      - name: Commit Worker source to GitHub
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add worker/worker.js

          if git diff --cached --quiet; then
            echo "Worker source already matches GitHub."
          else
            git commit -m "Import existing Relay Worker [skip ci]"
            git push
          fi
