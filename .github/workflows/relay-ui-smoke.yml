name: Relay UI smoke check
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'relay-app-v2.html'
      - 'scripts/smoke-relay-ui.mjs'
      - '.github/workflows/relay-ui-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both Relay app entry points
        run: node scripts/smoke-relay-ui.mjs
