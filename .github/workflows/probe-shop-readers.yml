name: Probe shop readers
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe/dump-names.mjs
      - uses: actions/upload-artifact@v4
        with: { name: names, path: names.json, retention-days: 1 }
