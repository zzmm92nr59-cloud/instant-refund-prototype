name: Probe shop readers
on:
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe/dump-names.mjs
      - run: |
          git config user.name "relay-probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-data/names && git rm -rfq . && git add -f names.json && git commit -qm "names" && git push -f origin probe-data/names
