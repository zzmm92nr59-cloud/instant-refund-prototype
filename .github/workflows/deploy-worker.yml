name: Deploy Relay Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Worker source
        run: |
          test -f worker/worker.js || { echo "worker/worker.js is missing"; exit 1; }
          node --check worker/worker.js
          node --check worker/shopify.js
          node --check worker/shopify-webhooks.js
          node --check worker/auth.js
          node --check worker/receipt-parser.js
          node --check worker/gmail.js
          node --check worker/resale.js
          node --check worker/original.js
          node --check worker/passkeys.js
          node --check worker/totp.js
          node --check worker/resale-admin.js
          node --check worker/retailer.js
          node --check worker/shopify-connect.js
          node scripts/test-shopify-multi-store.mjs
          node scripts/test-shopify-token-exchange.mjs
          node scripts/test-auth.mjs
          node scripts/test-receipt-parser.mjs
          node scripts/test-receipt-category.mjs
          node scripts/test-gmail.mjs
          node scripts/test-resale.mjs
          node scripts/test-resale-admin.mjs
          node scripts/test-push.mjs
          node scripts/test-square-connect.mjs
          node scripts/test-retailer.mjs
          node scripts/test-shopify-connect.mjs
          node scripts/test-shopify-pilot-apps.mjs
          node scripts/test-exchange.mjs
          node --check worker/returns.js
          node scripts/test-returns-offline.mjs
          node scripts/test-resellable.mjs
          node --check worker/awin-feed.js
          node scripts/test-awin-feed.mjs
          # Load the whole Worker so a misspelt import fails here, not at deploy time.
          node --input-type=module -e "const m = await import('./worker/worker.js'); if (!m.default || !m.default.fetch || !m.default.scheduled) { console.error('worker.js did not load'); process.exit(1); }"
      - name: Apply catalogue and inventory schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute relay-purchase-ledger --remote --file=migrations/0002_retailer_catalogue_inventory.sql
      - name: Seed fictional demo retailers and inventory
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute relay-purchase-ledger --remote --file=migrations/0003_demo_inventory.sql
      - name: Deploy existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # GitHub Actions secrets do not automatically become Worker runtime secrets.
      # Set these through Wrangler without printing their values to the log.
      - name: Configure Plaid Sandbox secrets for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
        run: |
          if [ -z "$PLAID_CLIENT_ID" ] || [ -z "$PLAID_SECRET" ]; then
            echo "Plaid Actions secrets unavailable; skipping optional Sandbox bank-link setup."
            exit 0
          fi
          printf '%s' "$PLAID_CLIENT_ID" | npx --yes wrangler@4 secret put PLAID_CLIENT_ID
          printf '%s' "$PLAID_SECRET" | npx --yes wrangler@4 secret put PLAID_SECRET

      # Re-applied on every deploy because dashboard-added values are removed by a deploy.
      # Values come from GitHub Actions secrets and are never printed.
      - name: Configure Shopify test-store secrets for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; then
            echo "Shopify Actions secrets unavailable; skipping Shopify test-store connection."
            exit 0
          fi
          printf '%s' "$SHOPIFY_CLIENT_ID" | npx --yes wrangler@4 secret put SHOPIFY_CLIENT_ID
          printf '%s' "$SHOPIFY_CLIENT_SECRET" | npx --yes wrangler@4 secret put SHOPIFY_CLIENT_SECRET

      # Shopper sign-in. Without both secrets, sign-in stays off (the Worker answers "not configured").
      - name: Configure shopper sign-in secrets for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RELAY_EMAIL_FROM: ${{ secrets.RELAY_EMAIL_FROM }}
        run: |
          if [ -z "$AUTH_SECRET" ] || [ -z "$RESEND_API_KEY" ]; then
            echo "Sign-in Actions secrets unavailable; sign-in stays switched off."
            exit 0
          fi
          printf '%s' "$AUTH_SECRET" | npx --yes wrangler@4 secret put AUTH_SECRET
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
          if [ -n "$RELAY_EMAIL_FROM" ]; then
            printf '%s' "$RELAY_EMAIL_FROM" | npx --yes wrangler@4 secret put RELAY_EMAIL_FROM
          fi

      # Who may review resale reports. A GitHub Actions secret holding the admin's sign-in email(s), comma separated,
      # so the address never sits in the public repo. Without it nobody is an admin.
      - name: Configure report reviewer for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_ADMIN_EMAILS: ${{ secrets.RELAY_ADMIN_EMAILS }}
        run: |
          if [ -z "$RELAY_ADMIN_EMAILS" ]; then
            echo "RELAY_ADMIN_EMAILS unavailable; report review stays off."
            exit 0
          fi
          printf '%s' "$RELAY_ADMIN_EMAILS" | npx --yes wrangler@4 secret put RELAY_ADMIN_EMAILS

      # Google OAuth client for the Gmail connection (created in Google Cloud Console, kept in Actions secrets).
      - name: Configure Gmail connection secrets for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "Google Actions secrets unavailable; Gmail connection stays switched off."
            exit 0
          fi
          printf '%s' "$GOOGLE_CLIENT_ID" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_SECRET

      # Store-level "Order payment" webhook signing key (set by hand in Shopify admin for the test store).
      # Without it the Worker falls back to the app client secret and orders from that webhook are rejected.
      - name: Configure Shopify webhook signing key for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SHOPIFY_WEBHOOK_SECRET" ]; then
            echo "SHOPIFY_WEBHOOK_SECRET unavailable; skipping."
            exit 0
          fi
          printf '%s' "$SHOPIFY_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put SHOPIFY_WEBHOOK_SECRET
