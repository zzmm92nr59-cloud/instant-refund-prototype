name: Relay identity tests
on:
  push:
    paths:
      - 'identity/**'
      - '.github/workflows/identity-tests.yml'
  pull_request:
    paths:
      - 'identity/**'
      - '.github/workflows/identity-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run purchase matching tests
        run: node identity/purchase-identity.test.mjs
