name: Test multiple Square Sandbox card identities
on:
  workflow_dispatch:
jobs:
  multiple-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run four Square Sandbox test card sources
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: node scripts/test-square-multiple-cards.mjs
