function commitDemoOrder(sku,isExchange){
 try{inventoryChanges=JSON.parse(localStorage.getItem(demoInventoryKey)||"{}")||{};catalog=catalog.filter(x=>!x.fixture).concat(demoProducts())}catch{showCheckoutError("Could not read demo stock. No exchange was recorded.");return}
 if(!isExchange||!exchangeContext)return showCheckoutError("Start from your Wallet purchase, then choose Exchange.");

 if(!p||(p.fixture!==true&&p.provider!=="square_sandbox"))return showCheckoutError("This catalogue item is not part of the demo.");
 if(!selected||selected.demo!==true)return showCheckoutError("Real purchases require retailer authorisation. This simulation only accepts fictional purchases.");
 const existing=readDemoLog(),now=new Date().toISOString(),id=demoRequestId();
 let rec;
 try{
   const previewSimulation=p.fixture!==true&&p.provider==="square_sandbox";
   if(chosen&&chosen.sku===sku&&chosen.priceMinor!==p.priceMinor)throw Error("The replacement price changed. Go back and review the updated offer.");
   const candidate={...p,store:storeOf(p),previewSimulation};
   rec=RelayExchangeEngine.createExchange({purchase:selected,candidate,reason,existing,id,at:now,fulfilmentMode:planPreview==="free"?"hold":"advance"});
   rec={...rec,customer:activeShopper(),originalSource:selected.source||"demo"};
   if(p.fixture&&Number(p.quantity)<1)throw Error("The demo item is out of stock.");
   const nextChanges=p.fixture?{...inventoryChanges,[sku]:{...(inventoryChanges[sku]||{}),quantity:Number(p.quantity)-1,updatedAt:now}}:inventoryChanges;
   const nextLog=[rec,...existing],oldLog=localStorage.getItem("relay-demo-orders-v1"),oldInv=localStorage.getItem(demoInventoryKey);
   try{
     localStorage.setItem("relay-demo-orders-v1",JSON.stringify(nextLog));
     if(p.fixture)localStorage.setItem(demoInventoryKey,JSON.stringify(nextChanges));
   }catch(writeError){
     try{if(oldLog===null)localStorage.removeItem("relay-demo-orders-v1");else localStorage.setItem("relay-demo-orders-v1",oldLog);
       if(p.fixture){if(oldInv===null)localStorage.removeItem(demoInventoryKey);else localStorage.setItem(demoInventoryKey,oldInv)}}catch{}
     throw writeError;
   }
   if(p.fixture){inventoryChanges=nextChanges;catalog=catalog.filter(x=>!x.fixture).concat(demoProducts())}
 }catch(e){showCheckoutError(e.message);return}
 const confirm=$("placeSelected");if(confirm){confirm.disabled=true;confirm.textContent="✓ Demo exchange recorded"}

}

// Each catalogue is asked for at the same time and given 10 seconds, so one slow source never hides the others.
function fetchWithin(url,ms){const c=typeof AbortController==="function"?new AbortController():null;const t=c?setTimeout(()=>c.abort(),ms):null;return fetch(url,{cache:"no-store",...(c?{signal:c.signal}:{})}).finally(()=>{if(t)clearTimeout(t)})}

async function loadCatalog(manual=false){
 let next=demoProducts(),squareError=null;try{
 const squareAsk=fetchWithin(API+"/relay/live-test/products",10000),shopifyAsk=fetchWithin(API+"/relay/shopify/catalogue"+(testTools()||reviewAccount()?"?test=1":""),10000);
 squareAsk.catch(()=>{});shopifyAsk.catch(()=>{});
 try{
  const response=await squareAsk;
  if(!response.ok)throw Error("Square catalogue HTTP "+response.status);
  const data=await response.json();
  next=[...(Array.isArray(data.products)?data.products:[]).filter(p=>p.sku&&Number.isFinite(Number(p.priceMinor))).map(p=>({...p,provider:"square_sandbox",store:p.storeName||"Relay Demo Store",fixture:false})),...next];
 }catch(e){squareError=e.message}
 // Independent retailer feed: a Square outage must not suppress a connected Shopify catalogue.
 try{
  const response=await shopifyAsk;
  if(response.ok){
   const data=await response.json();
   if(data.published&&Array.isArray(data.products)){
    const published=data.products.filter(p=>p.sku&&Number.isFinite(Number(p.priceMinor))).map(p=>({...p,provider:"shopify",store:p.storeName||p.shopDomain||"Shopify retailer",fixture:false}));
    next.push(...published);
   }
  }
 }catch{}
 catalog=next.filter(p=>!p.fixture).concat(demoProducts());
 }finally{catalogReady=true}
 if(page==="wallet")render();
 if(manual){
  for(const [sku,w] of Object.entries(watch)){
   const p=catalog.find(x=>x.sku===sku);
   if(p&&history[sku]===undefined)history[sku]=w.baseline;
  }
  localStorage.setItem("relay-radar-history-v2",JSON.stringify(history));
  if(squareError)console.warn("Square unavailable; independent demo/Shopify feeds remain available",squareError);
 }
 if(page==="discover"&&!$("backToResults"))renderCatalog();
 if(page==="radar")showRadar();
}

}
