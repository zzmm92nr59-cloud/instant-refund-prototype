<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Instant Refund Prototype</title>
<style>
:root{--ink:#101828;--muted:#667085;--bg:#f5f7fb;--good:#067647;--goodbg:#ecfdf3;--warn:#b54708;--warnbg:#fffaeb}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4e7ec;padding:13px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.brand small{font-weight:600;color:var(--muted);font-size:11px;margin-left:7px}.switch{display:flex;background:#f2f4f7;border-radius:12px;padding:3px}.switch button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;color:#667085}.switch .active{background:#fff;color:#101828;box-shadow:0 1px 4px #0001}.wrap{max-width:1080px;margin:auto;padding:25px 16px 70px}.mobile{max-width:430px}.hidden{display:none}.hello{font-size:29px;font-weight:850;letter-spacing:-1px;margin:7px 0}.sub{color:var(--muted);margin:0 0 22px}.banner{background:#101828;color:#fff;border-radius:20px;padding:20px;margin-bottom:18px}.banner p{color:#d0d5dd;font-size:14px;line-height:1.45;margin:7px 0 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:21px 1px 11px}.sectionhead h3{margin:0}.pill{font-size:12px;font-weight:750;padding:5px 9px;border-radius:99px;background:var(--goodbg);color:var(--good)}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:15px;box-shadow:0 2px 10px #10182808;margin-bottom:12px}.purchase{cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:13px;align-items:center}.thumb{width:64px;height:70px;border-radius:13px;background:linear-gradient(145deg,#f1f3f6,#dfe4ea);display:flex;align-items:center;justify-content:center;font-size:28px}.merchant{font-size:12px;color:#667085;font-weight:700;text-transform:uppercase}.item{font-weight:800;margin:3px 0;font-size:15px}.meta{font-size:12px;color:#667085}.price{text-align:right;font-weight:850}.eligible{font-size:10px;color:var(--good);margin-top:6px}.live{font-size:10px;color:#175cd3;margin-top:3px}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:14px 15px;font-weight:800;cursor:pointer}.primary{background:#101828;color:#fff}.secondary{background:#f2f4f7;color:#344054;margin-top:8px}.back{border:0;background:none;font-size:14px;font-weight:750;padding:3px 0 14px;cursor:pointer}.detailHero{text-align:center;padding:18px 0}.detailHero .thumb{margin:auto;width:112px;height:122px;font-size:48px}.detailHero h2{margin:15px 0 5px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f1f3;font-size:14px}.row span:first-child{color:#667085}.notice{border-radius:13px;padding:13px;font-size:13px;line-height:1.45;margin:13px 0}.green{background:var(--goodbg);color:#05603a}.yellow{background:var(--warnbg);color:#7a2e0e}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e4e7ec;border-radius:13px;padding:14px;margin:8px 0;font-weight:700;cursor:pointer}.refundAmount{font-size:45px;font-weight:900;letter-spacing:-2px;text-align:center;margin:24px 0 4px}.center{text-align:center}.face{width:95px;height:95px;border:4px solid #101828;border-radius:25px;margin:25px auto;display:flex;align-items:center;justify-content:center;font-size:40px}.success{width:80px;height:80px;background:var(--goodbg);color:var(--good);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;margin:20px auto}.tiny{font-size:11px;color:#667085}.plus{background:linear-gradient(135deg,#1d2939,#344054);color:#fff}.plus p{color:#d0d5dd;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:17px}.metric .label{font-size:12px;color:#667085}.metric .num{font-size:25px;font-weight:900;margin-top:5px}.loading{padding:16px;text-align:center;color:#667085}.error{background:#fef3f2;color:#b42318;border-radius:13px;padding:12px;margin-bottom:12px;font-size:12px}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.brand small{display:none}}
</style></head><body>
<header class="top"><div class="brand">relay <small>LIVE API PROTOTYPE</small></div><div class="switch"><button id="consumerBtn" class="active" onclick="mode('consumer')">Consumer</button><button id="merchantBtn" onclick="mode('merchant')">Retailer</button></div></header>
<main id="consumer" class="wrap mobile"></main><main id="merchant" class="wrap hidden"></main>
<script>
const SQUARE_PURCHASES_URL='https://relay-square-api2.9pts72cy5j.workers.dev/purchases';
let purchases=[{id:'demo-2',merchant:'SOLE',item:'Runner 02 Trainers',detail:'White · Size 9',price:165,date:'28 Sep',deadline:'26 Oct',icon:'👟',eligible:true},{id:'demo-3',merchant:'FORM',item:'Relaxed Trousers',detail:'Black · 32R',price:79,date:'24 Sep',deadline:'22 Oct',icon:'👖',eligible:true}];
let selected=purchases[0],reason='',apiError='';
function money(n){return '£'+Number(n).toFixed(2)}
function mode(m){consumer.classList.toggle('hidden',m!=='consumer');merchant.classList.toggle('hidden',m!=='merchant');consumerBtn.classList.toggle('active',m==='consumer');merchantBtn.classList.toggle('active',m==='merchant');if(m==='merchant')renderMerchant()}
function home(){consumer.innerHTML=`<div class="hello">Your purchases</div><p class="sub">Everything you've bought. One place.</p><div class="banner"><b>Refunds without the wait.</b><p>Eligible purchases can be refunded in seconds. Get your money first, then return the item by the deadline.</p></div>${apiError?`<div class="error">Square connection: ${apiError}</div>`:''}<div class="sectionhead"><h3>Recent purchases</h3><span class="pill">${purchases.length} eligible</span></div>${purchases.map(p=>`<div class="card purchase" onclick="detail('${p.id}')"><div class="thumb">${p.icon}</div><div><div class="merchant">${p.merchant}</div><div class="item">${p.item}</div><div class="meta">${p.detail} · ${p.date}</div>${p.live?'<div class="live">● Imported automatically from Square Sandbox</div>':''}</div><div class="price">${money(p.price)}<div class="eligible">Instant refund ✓</div></div></div>`).join('')}<div class="card plus"><b>relay+</b><p>Higher refund limits, enhanced eligibility and smart return reminders.</p><b>£1.99/month</b></div><p class="tiny center">Prototype only — Square purchase data is real Sandbox data; refunds and payouts remain simulated.</p>`}
function detail(id){selected=purchases.find(x=>String(x.id)===String(id));consumer.innerHTML=`<button class="back" onclick="home()">← Purchases</button><div class="detailHero"><div class="thumb">${selected.icon}</div><h2>${selected.item}</h2><div class="merchant">${selected.merchant}</div><div class="big">${money(selected.price)}</div></div><div class="card"><div class="row"><span>Variant</span><b>${selected.detail}</b></div><div class="row"><span>Purchased</span><b>${selected.date}</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div><div class="row"><span>Receipt</span><b>${selected.live?'Square API verified ✓':'Verified digitally ✓'}</b></div>${selected.orderId?`<div class="row"><span>Order</span><b>${selected.orderId.slice(0,8)}…</b></div>`:''}</div><div class="notice green"><b>Instant refund available</b><br>You're eligible to receive ${money(selected.price)} before you return this item.</div><button class="primary" onclick="reasons()">Return this item</button><p class="tiny center">Prototype: no real funds will be sent.</p>`}
function reasons(){consumer.innerHTML=`<button class="back" onclick="detail('${selected.id}')">← Back</button><h2>Why are you returning it?</h2><p class="sub">This helps ${selected.merchant} improve.</p>${['Wrong size / fit','Changed my mind','Not as expected','Ordered more than one','Other'].map(r=>`<button class="choice" onclick="offer('${r}')">${r}<span style="float:right">›</span></button>`).join('')}`}
function offer(r){reason=r;consumer.innerHTML=`<button class="back" onclick="reasons()">← Back</button><div class="center"><span class="pill">Eligible for Instant Refund</span></div><div class="refundAmount">${money(selected.price)}</div><p class="center sub">sent to your linked bank account</p><div class="card"><div class="row"><span>Refund timing</span><b>Seconds</b></div><div class="row"><span>Return item by</span><b>${selected.deadline}</b></div><div class="row"><span>Reason</span><b>${reason}</b></div><div class="row"><span>Fee to customer</span><b>£0.00</b></div></div><div class="notice yellow"><b>You get the money before returning the item.</b><br>Return it by ${selected.deadline}. This demo does not create a real refund or credit agreement.</div><button class="primary" onclick="auth()">Get ${money(selected.price)} now</button><button class="secondary" onclick="detail('${selected.id}')">Use standard retailer refund</button>`}
function auth(){consumer.innerHTML=`<div class="center"><h2>Confirm it's you</h2><p class="sub">Authorise your simulated instant refund.</p><div class="face">⌁</div><button class="primary" onclick="success()">Simulate Face ID</button></div>`}
function success(){consumer.innerHTML=`<div class="center"><div class="success">✓</div><h2>Refund sent</h2><div class="refundAmount">${money(selected.price)}</div><p class="sub">Simulated payout completed in 4 seconds</p></div><div class="card"><div class="row"><span>Status</span><b style="color:#067647">Money advanced ✓</b></div><div class="row"><span>Next step</span><b>Return item</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div></div><button class="secondary" onclick="home()">Back to purchases</button><p class="tiny center">Prototype only — no money has actually moved.</p>`}
function renderMerchant(){const live=purchases.filter(p=>p.live);merchant.innerHTML=`<div class="merchant">RELAY FOR RETAILERS</div><h1>Refund operations</h1><p class="sub">Prototype merchant dashboard</p><div class="metrics"><div class="metric"><div class="label">Refunds this month</div><div class="num">£48.2k</div></div><div class="metric"><div class="label">Instant refunds</div><div class="num">82%</div></div><div class="metric"><div class="label">Avg. refund time</div><div class="num">4 sec</div></div><div class="metric"><div class="label">Square purchases</div><div class="num" style="color:#067647">${live.length}</div></div></div><div class="card" style="margin-top:20px"><b>Square Sandbox feed</b><p>${live.length?live.map(p=>`${p.item} · ${money(p.price)}`).join('<br>'):'No Square purchases returned.'}</p><p class="tiny">Relay fetches recent orders from Square without a hard-coded Order ID. Refund metrics remain fictional.</p></div>`}
async function loadSquarePurchases(){consumer.innerHTML='<div class="loading">Loading recent purchases from Square Sandbox…</div>';try{const res=await fetch(SQUARE_PURCHASES_URL,{cache:'no-store'});if(!res.ok)throw new Error('API returned '+res.status);const data=await res.json();if(!Array.isArray(data.purchases))throw new Error('No purchases array returned');const live=[];for(const order of data.purchases){const d=new Date(order.createdAt);for(let i=0;i<(order.items||[]).length;i++){const item=order.items[i];live.push({id:'sq-'+order.orderId+'-'+i,orderId:order.orderId,merchant:'NORTH & CO.',item:item.name||'Square purchase',detail:item.variation||'Standard',price:Number(item.price??order.total??0),date:d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),deadline:'30 Oct',icon:'👕',eligible:true,live:true});}}purchases=purchases.filter(p=>!p.live);purchases.unshift(...live);if(live.length)selected=live[0]}catch(e){apiError=e.message}home()}
loadSquarePurchases();
</script></body></html>
