<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Instant Refund Prototype</title><style>:root{--ink:#101828;--muted:#667085;--bg:#f5f7fb;--card:#fff;--brand:#222;--soft:#eef2f6;--good:#067647;--goodbg:#ecfdf3;--warn:#b54708;--warnbg:#fffaeb}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e7ec;padding:13px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px;letter-spacing:-.7px}.brand small{font-weight:600;color:var(--muted);font-size:11px;margin-left:7px}.switch{display:flex;background:#f2f4f7;border-radius:12px;padding:3px}.switch button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;color:#667085}.switch .active{background:#fff;color:#101828;box-shadow:0 1px 4px #0001}.wrap{max-width:1080px;margin:0 auto;padding:25px 16px 70px}.mobile{max-width:430px;margin:auto}.hello{font-size:29px;font-weight:850;letter-spacing:-1px;margin:7px 0}.sub{color:var(--muted);margin:0 0 22px}.banner{background:#101828;color:#fff;border-radius:20px;padding:20px;margin-bottom:18px}.banner b{font-size:18px}.banner p{color:#d0d5dd;font-size:14px;line-height:1.45;margin:7px 0 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:21px 1px 11px}.sectionhead h3{margin:0}.pill{font-size:12px;font-weight:750;padding:5px 9px;border-radius:99px;background:var(--goodbg);color:var(--good)}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:15px;box-shadow:0 2px 10px #10182808;margin-bottom:12px}.purchase{cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:13px;align-items:center}.thumb{width:64px;height:70px;border-radius:13px;background:linear-gradient(145deg,#f1f3f6,#dfe4ea);display:flex;align-items:center;justify-content:center;font-size:28px}.merchant{font-size:12px;color:#667085;font-weight:700;text-transform:uppercase;letter-spacing:.3px}.item{font-weight:800;margin:3px 0;font-size:15px}.meta{font-size:12px;color:#667085}.price{text-align:right;font-weight:850}.eligible{font-size:10px;color:var(--good);margin-top:6px}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:14px 15px;font-weight:800;cursor:pointer}.primary{background:#101828;color:white}.secondary{background:#f2f4f7;color:#344054;margin-top:8px}.back{border:0;background:none;font-size:14px;font-weight:750;padding:3px 0 14px;cursor:pointer}.detailHero{text-align:center;padding:18px 0}.detailHero .thumb{margin:auto;width:112px;height:122px;font-size:48px}.detailHero h2{margin:15px 0 5px}.detailHero .big{font-size:28px;font-weight:900}.rows{margin:15px 0}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f1f3;font-size:14px}.row span:first-child{color:#667085}.notice{border-radius:13px;padding:13px;font-size:13px;line-height:1.45;margin:13px 0}.green{background:var(--goodbg);color:#05603a}.yellow{background:var(--warnbg);color:#7a2e0e}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e4e7ec;border-radius:13px;padding:14px;margin:8px 0;font-weight:700;cursor:pointer}.choice:hover{border-color:#98a2b3}.refundAmount{font-size:45px;font-weight:900;letter-spacing:-2px;text-align:center;margin:24px 0 4px}.center{text-align:center}.face{width:95px;height:95px;border:4px solid #101828;border-radius:25px;margin:25px auto;display:flex;align-items:center;justify-content:center;font-size:40px}.success{width:80px;height:80px;background:var(--goodbg);color:var(--good);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;margin:20px auto}.qr{width:165px;height:165px;margin:20px auto;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/22px 22px;border:10px solid white;box-shadow:0 0 0 1px #ddd}.tiny{font-size:11px;color:#667085}.plus{background:linear-gradient(135deg,#1d2939,#344054);color:#fff}.plus p{color:#d0d5dd;font-size:13px}.dashHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.dashHead h1{margin:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:17px}.metric .label{font-size:12px;color:#667085}.metric .num{font-size:25px;font-weight:900;margin-top:5px}.table{background:#fff;border:1px solid #eaecf0;border-radius:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:14px;border-bottom:1px solid #f0f1f3;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#667085;background:#fcfcfd}.status{padding:5px 8px;border-radius:99px;font-size:11px;font-weight:750;background:#f2f4f7}.status.wait{background:#fff4e5;color:#93370d}.status.done{background:#ecfdf3;color:#067647}.sim{border:1px dashed #98a2b3;background:#fff;border-radius:15px;padding:15px;margin-top:17px}.sim button{width:auto;padding:10px 14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 17px;border-radius:10px;font-size:13px;box-shadow:0 8px 25px #0003}.hidden{display:none}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.top{padding:10px}.brand small{display:none}.wrap{padding-top:16px}.dashHead{align-items:start;flex-direction:column;gap:8px}} </style></head><body><header class="top"><div class="brand">relay <small>PROTOTYPE</small></div><div class="switch"><button id="consumerBtn" class="active" onclick="mode('consumer')">Consumer</button><button id="merchantBtn" onclick="mode('merchant')">Retailer</button></div></header><main id="consumer" class="wrap mobile"></main><main id="merchant" class="wrap hidden"></main><div id="toast" class="toast hidden"></div><script>const purchases=[{id:1,merchant:'NORTH & CO.',item:'Essential Overshirt',detail:'Navy · Size M',price:129,date:'Today, 13:42',deadline:'30 Oct',icon:'🧥',eligible:true},{id:2,merchant:'SOLE',item:'Runner 02 Trainers',detail:'White · Size 9',price:165,date:'28 Sep',deadline:'26 Oct',icon:'👟',eligible:true},{id:3,merchant:'FORM',item:'Relaxed Trousers',detail:'Black · 32R',price:79,date:'24 Sep',deadline:'22 Oct',icon:'👖',eligible:true}];let selected=purchases[0],reason='';function money(n){return '£'+n.toFixed(2)}function mode(m){document.getElementById('consumer').classList.toggle('hidden',m!=='consumer');document.getElementById('merchant').classList.toggle('hidden',m!=='merchant');consumerBtn.classList.toggle('active',m==='consumer');merchantBtn.classList.toggle('active',m==='merchant');if(m==='merchant')renderMerchant()}function home(){consumer.innerHTML=`<div class="hello">Your purchases</div><p class="sub">Everything you've bought. One place.</p><div class="banner"><b>Refunds without the wait.</b><p>Eligible purchases can be refunded in seconds. Get your money first, then return the item by the deadline.</p></div><div class="sectionhead"><h3>Recent purchases</h3><span class="pill">3 eligible</span></div>${purchases.map(p=>`<div class="card purchase" onclick="detail(${p.id})"><div class="thumb">${p.icon}</div><div><div class="merchant">${p.merchant}</div><div class="item">${p.item}</div><div class="meta">${p.detail} · ${p.date}</div></div><div class="price">${money(p.price)}<div class="eligible">Instant refund ✓</div></div></div>`).join('')}<div class="card plus"><b>relay+</b><p>Higher refund limits, enhanced eligibility and smart return reminders.</p><b>£1.99/month</b></div><p class="tiny center">Demo only — purchases, eligibility and payouts are simulated.</p>`}function detail(id){selected=purchases.find(x=>x.id===id);consumer.innerHTML=`<button class="back" onclick="home()">← Purchases</button><div class="detailHero"><div class="thumb">${selected.icon}</div><h2>${selected.item}</h2><div class="merchant">${selected.merchant}</div><div class="big">${money(selected.price)}</div></div><div class="card rows"><div class="row"><span>Variant</span><b>${selected.detail}</b></div><div class="row"><span>Purchased</span><b>${selected.date}</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div><div class="row"><span>Receipt</span><b>Verified digitally ✓</b></div></div><div class="notice green"><b>Instant refund available</b><br>You're eligible to receive ${money(selected.price)} before you return this item.</div><button class="primary" onclick="reasons()">Return this item</button><p class="tiny center">Prototype: no real funds will be sent.</p>`}function reasons(){consumer.innerHTML=`<button class="back" onclick="detail(${selected.id})">← Back</button><h2>Why are you returning it?</h2><p class="sub">This helps ${selected.merchant} improve.</p>${['Wrong size / fit','Changed my mind','Not as expected','Ordered more than one','Other'].map(r=>`<button class="choice" onclick="offer('${r}')">${r}<span style="float:right">›</span></button>`).join('')}`};function offer(r){reason=r;consumer.innerHTML=`<button class="back" onclick="reasons()">← Back</button><div class="center"><span class="pill">Eligible for Instant Refund</span></div><div class="refundAmount">${money(selected.price)}</div><p class="center sub">sent to your linked bank account</p><div class="card"><div class="row"><span>Refund timing</span><b>Seconds</b></div><div class="row"><span>Return item by</span><b>${selected.deadline}</b></div><div class="row"><span>Reason</span><b>${reason}</b></div><div class="row"><span>Fee to customer</span><b>£0.00</b></div></div><div class="notice yellow"><b>You get the money before returning the item.</b><br>Return it by ${selected.deadline} in line with the retailer's policy. This demo does not create a real refund or credit agreement.</div><button class="primary" onclick="auth()">Get ${money(selected.price)} now</button><button class="secondary" onclick="detail(${selected.id})">Use standard retailer refund</button>`}function auth(){consumer.innerHTML=`<div class="center"><h2>Confirm it's you</h2><p class="sub">Authorise your simulated instant refund.</p><div class="face">⌁</div><button class="primary" onclick="success()">Simulate Face ID</button><p class="tiny">In a production app this would use secure device authentication.</p></div>`}function success(){consumer.innerHTML=`<div class="center"><div class="success">✓</div><h2>Refund sent</h2><div class="refundAmount">${money(selected.price)}</div><p class="sub">Simulated payout completed in 4 seconds</p></div><div class="card"><div class="row"><span>Status</span><b style="color:#067647">Money advanced ✓</b></div><div class="row"><span>Next step</span><b>Return item</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div></div><button class="primary" onclick="returnQR()">Show return QR</button><button class="secondary" onclick="home()">Back to purchases</button><p class="tiny center">Prototype only — no money has actually moved.</p>`}function returnQR(){consumer.innerHTML=`<button class="back" onclick="success()">← Refund</button><div class="center"><h2>Return your item</h2><p class="sub">Show this code at a participating store or use it to start the postal return.</p><div class="qr"></div><h3>${selected.merchant}</h3><p>${selected.item}</p><div class="notice green"><b>Refund already advanced</b><br>Return by ${selected.deadline}. The retailer can see that your refund has already been paid.</div><button class="primary" onclick="home()">Done</button></div>`}function renderMerchant(){merchant.innerHTML=`<div class="dashHead"><div><div class="merchant">RELAY FOR RETAILERS</div><h1>Refund operations</h1></div><div class="tiny">Demo merchant · Live-style dashboard</div></div><div class="metrics"><div class="metric"><div class="label">Refunds this month</div><div class="num">£48.2k</div></div><div class="metric"><div class="label">Instant refunds</div><div class="num">82%</div></div><div class="metric"><div class="label">Avg. refund time</div><div class="num">4 sec</div></div><div class="metric"><div class="label">Outstanding exposure</div><div class="num">£8.4k</div></div></div><div class="table"><table><thead><tr><th>Customer</th><th>Item</th><th>Amount</th><th>Refund</th><th>Return</th><th>Settlement</th></tr></thead><tbody id="cases"><tr><td>C. Morgan</td><td>Essential Overshirt</td><td>£129.00</td><td><span class="status done">Advanced</span></td><td><span class="status wait">Awaiting return</span></td><td>Due on return</td></tr><tr><td>A. Patel</td><td>Leather Loafer</td><td>£145.00</td><td><span class="status done">Advanced</span></td><td><span class="status done">Returned</span></td><td>Settled</td></tr><tr><td>S. Jones</td><td>Wool Coat</td><td>£219.00</td><td><span class="status done">Advanced</span></td><td><span class="status wait">Awaiting return</span></td><td>£219 due</td></tr></tbody></table></div><div class="sim"><b>POS/API demonstration</b><p class="sub" style="margin:5px 0 12px">Simulate an item-level purchase arriving from a connected retailer POS.</p><button class="primary" onclick="simulate()">+ Simulate new purchase</button></div><p class="tiny">All figures and customer records are fictional prototype data.</p>`}function simulate(){const p={id:purchases.length+1,merchant:'NORTH & CO.',item:'Merino Knit',detail:'Stone · Size M',price:95,date:'Just now',deadline:'30 Oct',icon:'👕',eligible:true};purchases.unshift(p);showToast('POS webhook received → Merino Knit added to consumer wallet');setTimeout(()=>mode('consumer'),1200)}function showToast(t){toast.textContent=t;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2800)}home();</script></body></html>
