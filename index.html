<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Instant Refund Prototype</title><style>:root{--ink:#101828;--muted:#667085;--bg:#f5f7fb;--good:#067647;--goodbg:#ecfdf3;--warnbg:#fffaeb}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4e7ec;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;z-index:2}.brand{font-weight:900;font-size:21px}.brand small{font-weight:600;color:var(--muted);font-size:11px;margin-left:7px}.switch{display:flex;background:#f2f4f7;border-radius:12px;padding:3px}.switch button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;color:#667085}.switch .active{background:#fff;color:#101828;box-shadow:0 1px 4px #0001}.wrap{max-width:1080px;margin:auto;padding:25px 16px 70px}.mobile{max-width:430px}.hidden{display:none}.hello{font-size:29px;font-weight:850;letter-spacing:-1px;margin:7px 0}.sub{color:var(--muted);margin:0 0 22px}.banner{background:#101828;color:#fff;border-radius:20px;padding:20px;margin-bottom:18px}.banner p{color:#d0d5dd;font-size:14px;line-height:1.45;margin:7px 0 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:21px 1px 11px}.sectionhead h3{margin:0}.pill{font-size:12px;font-weight:750;padding:5px 9px;border-radius:99px;background:var(--goodbg);color:var(--good)}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:15px;box-shadow:0 2px 10px #10182808;margin-bottom:12px}.purchase{cursor:pointer;display:grid;grid-template-columns:72px 1fr auto;gap:13px;align-items:center}.thumb{width:72px;height:78px;border-radius:13px;background:#f1f3f6;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.merchant{font-size:12px;color:#667085;font-weight:700;text-transform:uppercase}.item{font-weight:800;margin:3px 0;font-size:15px}.meta{font-size:12px;color:#667085}.price{text-align:right;font-weight:850}.eligible{font-size:10px;color:var(--good);margin-top:6px}.live{font-size:10px;color:#175cd3;margin-top:3px}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:14px 15px;font-weight:800;cursor:pointer}.primary{background:#101828;color:#fff}.secondary{background:#f2f4f7;color:#344054;margin-top:8px}.back{border:0;background:none;font-size:14px;font-weight:750;padding:3px 0 14px;cursor:pointer}.detailHero{text-align:center;padding:18px 0}.detailHero .thumb{margin:auto;width:160px;height:170px;font-size:48px}.detailHero h2{margin:15px 0 5px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f1f3;font-size:14px}.row span:first-child{color:#667085}.notice{border-radius:13px;padding:13px;font-size:13px;line-height:1.45;margin:13px 0}.green{background:var(--goodbg);color:#05603a}.yellow{background:var(--warnbg);color:#7a2e0e}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e4e7ec;border-radius:13px;padding:14px;margin:8px 0;font-weight:700;cursor:pointer}.refundAmount{font-size:45px;font-weight:900;letter-spacing:-2px;text-align:center;margin:24px 0 4px}.center{text-align:center}.face{width:95px;height:95px;border:4px solid #101828;border-radius:25px;margin:25px auto;display:flex;align-items:center;justify-content:center;font-size:40px}.success{width:80px;height:80px;background:var(--goodbg);color:var(--good);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;margin:20px auto}.tiny{font-size:11px;color:#667085}.plus{background:linear-gradient(135deg,#1d2939,#344054);color:#fff}.plus p{color:#d0d5dd;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:17px}.metric .label{font-size:12px;color:#667085}.metric .num{font-size:25px;font-weight:900;margin-top:5px}.loading{padding:16px;text-align:center;color:#667085}.error{background:#fef3f2;color:#b42318;border-radius:13px;padding:12px;margin-bottom:12px;font-size:12px}.identity{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:15px;margin-bottom:18px}.identityTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.identityTitle{font-weight:850}.identitySub{font-size:12px;color:#667085;margin-top:4px}.identity button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.identity .add{background:#101828;color:#fff}.identity .remove{background:#f2f4f7;color:#344054}.cardForm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cardForm select,.cardForm input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px;background:#fff;font:inherit}.cardForm button{grid-column:1/-1}.identityGood{color:#067647;font-weight:800;font-size:13px}.liveTest{background:#fff;border:1px solid #b2ddff;border-radius:18px;padding:16px;margin-bottom:18px}.liveTest b{font-size:16px}.liveTest p{font-size:12px;color:#667085;line-height:1.5;margin:6px 0 12px}.liveTest a{display:block;text-align:center;text-decoration:none;background:#175cd3;color:#fff;border-radius:12px;padding:13px;font-weight:850}.testDone{background:#ecfdf3;color:#05603a;border-radius:12px;padding:10px;font-size:12px;font-weight:750;margin-bottom:10px}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.brand small{display:none}}</style></head><body><header class="top"><div class="brand">relay <small>LIVE API PROTOTYPE</small></div><div class="switch"><button id="consumerBtn" class="active" onclick="mode('consumer')">Consumer</button><button id="merchantBtn" onclick="mode('merchant')">Retailer</button></div></header><main id="consumer" class="wrap mobile"></main><main id="merchant" class="wrap hidden"></main><script>const WORKER='https://relay-square-api2.9pts72cy5j.workers.dev';const API=WORKER+'/purchases';const VERIFIED_API=WORKER+'/relay/verified-purchases';let purchases=[],selected=null,reason='',apiError='';const money=n=>'£'+Number(n).toFixed(2);function fallback(n){n=String(n||'').toLowerCase();return n.includes('shoe')||n.includes('trainer')?'👟':'👕'}function visual(p){return p.imageUrl?`<img src="${p.imageUrl}" alt="${p.item}" onerror="this.parentNode.textContent='${fallback(p.item)}'">`:fallback(p.item)}function mode(m){consumer.classList.toggle('hidden',m!=='consumer');merchant.classList.toggle('hidden',m!=='merchant');consumerBtn.classList.toggle('active',m==='consumer');merchantBtn.classList.toggle('active',m==='merchant');if(m==='merchant')renderMerchant()}function cardIdentity(){const raw=localStorage.getItem('relayCard');let card=null;try{card=raw?JSON.parse(raw):null}catch{}if(card)return `<div class="identity"><div class="identityTop"><div><div class="identityTitle">Payment identity</div><div class="identitySub">Used by Relay to help identify your purchases.</div></div><button class="remove" onclick="removeCard()">Remove</button></div><div class="identityGood" style="margin-top:12px">${card.brand} •••• ${card.last4} registered ✓</div><div class="tiny" style="margin-top:6px">Prototype stores brand + last four only. Never enter a full card number.</div></div>`;return `<div class="identity"><div class="identityTop"><div><div class="identityTitle">Register a payment card</div><div class="identitySub">Help Relay recognise purchases made with your card.</div></div></div><div class="cardForm"><select id="cardBrand"><option>VISA</option><option>MASTERCARD</option><option>AMEX</option></select><input id="cardLast4" inputmode="numeric" maxlength="4" placeholder="Last 4 digits"><button class="add" onclick="registerCard()">Register card</button></div><div class="tiny" style="margin-top:8px">Prototype only — brand + last four digits. Do not enter a full card number.</div></div>`}async function registerCard(){const brand=document.getElementById('cardBrand').value;const last4=document.getElementById('cardLast4').value.trim();if(!/^\d{4}$/.test(last4)){alert('Enter exactly the last four digits.');return}try{const r=await fetch(WORKER+'/relay/test-lab/register-card',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({brand,last4})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Could not register card');localStorage.setItem('relayCard',JSON.stringify({brand,last4}));home()}catch(e){alert(e.message)}}async function removeCard(){try{await fetch(WORKER+'/relay/test-lab/clear-card',{method:'POST',credentials:'include'})}catch{}localStorage.removeItem('relayCard');home()}function liveTestCard(){const done=new URLSearchParams(location.search).get('liveTest')==='1';return `<div class="liveTest">${done?'<div class="testDone">✓ Live Square → Plaid purchase test completed. This verified purchase is now identity-gated to your Relay wallet.</div>':''}<b>Live purchase identity test</b><p>Make one £159.99 Jordans purchase using Square Sandbox. Relay will create the corresponding Plaid Sandbox signal and bring only the verified order back here.</p><a href="${WORKER}/relay/live-test">Run live Jordans test →</a></div>`}function home(){consumer.innerHTML=`<div class="hello">Your purchases</div><p class="sub">Everything you've bought. One place.</p><div class="banner"><b>Refunds without the wait.</b><p>Eligible purchases can be refunded in seconds. Get your money first, then return the item by the deadline.</p></div>${apiError?`<div class="error">Square connection: ${apiError}</div>`:''}${cardIdentity()}${liveTestCard()}<div class="sectionhead"><h3>Recent purchases</h3><span class="pill">${purchases.length} eligible</span></div>${purchases.map(p=>`<div class="card purchase" onclick="detail('${p.id}')"><div class="thumb">${visual(p)}</div><div><div class="merchant">${p.merchant}</div><div class="item">${p.item}</div><div class="meta">${p.detail} · ${p.date}</div><div class="live">● Verified by Relay purchase matching</div></div><div class="price">${money(p.price)}<div class="eligible">Instant refund ✓</div></div></div>`).join('')||'<div class="card">No verified purchases yet. Relay will only show a purchase after it has been confidently matched to you.</div>'}<div class="card plus"><b>relay+</b><p>Higher refund limits, enhanced eligibility and smart return reminders.</p><b>£1.99/month</b></div><p class="tiny center">Prototype only — unverified Square orders are hidden. Refunds and payouts remain simulated.</p>`}function detail(id){selected=purchases.find(x=>x.id===id);if(!selected)return home();consumer.innerHTML=`<button class="back" onclick="home()">← Purchases</button><div class="detailHero"><div class="thumb">${visual(selected)}</div><h2>${selected.item}</h2><div class="merchant">${selected.merchant}</div><div class="big">${money(selected.price)}</div></div><div class="card"><div class="row"><span>Variant</span><b>${selected.detail}</b></div><div class="row"><span>Purchased</span><b>${selected.date}</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div><div class="row"><span>Receipt</span><b>Square API verified ✓</b></div><div class="row"><span>Order</span><b>${selected.orderId.slice(0,8)}…</b></div></div><div class="notice green"><b>Instant refund available</b><br>You're eligible to receive ${money(selected.price)} before you return this item.</div><button class="primary" onclick="reasons()">Return this item</button><p class="tiny center">Prototype: no real funds will be sent.</p>`}function reasons(){consumer.innerHTML=`<button class="back" onclick="detail('${selected.id}')">← Back</button><h2>Why are you returning it?</h2><p class="sub">This helps ${selected.merchant} improve.</p>${['Wrong size / fit','Changed my mind','Not as expected','Ordered more than one','Other'].map(r=>`<button class="choice" onclick="offer('${r}')">${r}<span style="float:right">›</span></button>`).join('')}`}function offer(r){reason=r;consumer.innerHTML=`<button class="back" onclick="reasons()">← Back</button><h2>Choose how to resolve your return</h2><p class="sub">Reason: ${reason} · Return by ${selected.deadline}</p><button class="choice" onclick="refundChoice()"><b>Instant refund — ${money(selected.price)}</b><span style="float:right">›</span><div class="tiny">Simulated cash advance before you return the item.</div></button><button class="choice" onclick="exchangeChoice()"><b>Exchange item</b><span style="float:right">›</span><div class="tiny">Explore a replacement; subject to retailer availability.</div></button><button class="choice" onclick="creditChoice()"><b>Enhanced store credit</b><span style="float:right">›</span><div class="tiny">See whether the retailer offers a credit bonus.</div></button><p class="tiny center">Prototype only. No real refunds, exchanges or credit are issued.</p>`}function refundChoice(){consumer.innerHTML=`<button class="back" onclick="offer(reason)">← All options</button><div class="center"><span class="pill">Eligible for Instant Refund</span></div><div class="refundAmount">${money(selected.price)}</div><p class="center sub">Simulated advance to your linked bank account</p><div class="card"><div class="row"><span>Refund timing</span><b>Seconds (demo)</b></div><div class="row"><span>Return item by</span><b>${selected.deadline}</b></div><div class="row"><span>Reason</span><b>${reason}</b></div><div class="row"><span>Fee to customer</span><b>£0.00</b></div></div><div class="notice yellow"><b>Money first, return afterward.</b><br>Return by ${selected.deadline}. This is a simulation; no real payout is made.</div><button class="primary" onclick="auth()">Simulate ${money(selected.price)} instant refund</button>`}function exchangeChoice(){consumer.innerHTML=`<button class="back" onclick="offer(reason)">← All options</button><h2>Exchange your item</h2><p class="sub">Replace ${selected.item} with another size, colour or product.</p><div class="card"><b>Exchange catalogue coming next</b><p class="sub">Relay has not yet connected retailer replacement inventory for this verified purchase. We won't confirm an exchange without an available replacement.</p><div class="row"><span>Original purchase</span><b>${money(selected.price)}</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div></div><button class="primary" onclick="offer(reason)">Compare other return options</button>`}function creditChoice(){consumer.innerHTML=`<button class="back" onclick="offer(reason)">← All options</button><h2>Enhanced store credit</h2><p class="sub">Keep your spending power with ${selected.merchant}.</p><div class="card"><div class="row"><span>Base credit value</span><b>${money(selected.price)}</b></div><div class="row"><span>Bonus credit</span><b>Not configured</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div></div><div class="notice yellow">The retailer has not configured a bonus offer yet. No credit will be issued in this prototype.</div><button class="primary" onclick="offer(reason)">Compare other return options</button>`}function auth(){consumer.innerHTML=`<div class="center"><h2>Confirm it's you</h2><p class="sub">Authorise your simulated instant refund.</p><div class="face">⌁</div><button class="primary" onclick="success()">Simulate Face ID</button></div>`}function success(){consumer.innerHTML=`<div class="center"><div class="success">✓</div><h2>Refund sent</h2><div class="refundAmount">${money(selected.price)}</div><p class="sub">Simulated payout completed in 4 seconds</p></div><div class="card"><div class="row"><span>Status</span><b style="color:#067647">Money advanced ✓</b></div><div class="row"><span>Next step</span><b>Return item</b></div><div class="row"><span>Return by</span><b>${selected.deadline}</b></div></div><button class="secondary" onclick="home()">Back to purchases</button>`}function renderMerchant(){merchant.innerHTML=`<div class="merchant">RELAY FOR RETAILERS</div><h1>Refund operations</h1><p class="sub">Prototype merchant dashboard</p><div class="metrics"><div class="metric"><div class="label">Refunds this month</div><div class="num">£48.2k</div></div><div class="metric"><div class="label">Instant refunds</div><div class="num">82%</div></div><div class="metric"><div class="label">Avg. refund time</div><div class="num">4 sec</div></div><div class="metric"><div class="label">Square purchases</div><div class="num" style="color:#067647">${purchases.length}</div></div></div><div class="card" style="margin-top:20px"><b>Square Sandbox feed</b><p>${purchases.map(p=>`${p.item} · ${money(p.price)}`).join('<br>')}</p></div>`}async function load(){consumer.innerHTML='<div class="loading">Checking verified Relay purchases…</div>';const params=new URLSearchParams(location.search);const relayOrder=params.get('relayOrder');const relayBrand=params.get('relayBrand');const relayLast4=params.get('relayLast4');if(relayOrder)localStorage.setItem('relayVerifiedOrder',relayOrder);if(relayBrand&&relayLast4)localStorage.setItem('relayCard',JSON.stringify({brand:relayBrand,last4:relayLast4}));const savedOrder=localStorage.getItem('relayVerifiedOrder');let savedCard=null;try{savedCard=JSON.parse(localStorage.getItem('relayCard')||'null')}catch{}const q=new URLSearchParams();if(savedOrder)q.set('orderId',savedOrder);if(savedCard?.brand)q.set('brand',savedCard.brand);if(savedCard?.last4)q.set('last4',savedCard.last4);const verifiedUrl=VERIFIED_API+(q.toString()?'?'+q.toString():'');try{const r=await fetch(verifiedUrl,{cache:'no-store'});if(r.status===404){purchases=[];apiError='Identity-gated purchase feed is not live yet. Unverified Square orders are intentionally hidden.';return home()}if(!r.ok)throw Error('Verified purchase API returned '+r.status);const data=await r.json();const source=data.purchases||data.verifiedPurchases||[];const live=[];for(const o of source){if(o.matchStatus&&String(o.matchStatus).toUpperCase()!=='MATCHED')continue;if(o.verified===false)continue;const d=new Date(o.createdAt||o.authorizedAt||Date.now());for(let i=0;i<(o.items||[]).length;i++){const x=o.items[i];live.push({id:'sq-'+o.orderId+'-'+i,orderId:o.orderId,merchant:o.merchant||'NORTH & CO.',item:x.name||'Verified purchase',detail:x.variation||'Standard',price:Number(x.price??o.total??0),imageUrl:x.imageUrl||null,date:d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),deadline:o.deadline||'30 Oct'})}}purchases=live;selected=live[0]||null}catch(e){purchases=[];apiError=e.message}home()}load();</script></body></html>
