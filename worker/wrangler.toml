name = "relay-square-api2"
main = "worker.js"
compatibility_date = "2026-10-07"
workers_dev = true

# Not secret. Kept here because plain-text variables added in the Cloudflare dashboard
# are removed on every deploy (secrets are kept).
[vars]
SHOPIFY_SHOP_DOMAIN = "relay-ltd.myshopify.com"
AWIN_PUBLISHER_ID = "3134429"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "relay-purchase-ledger"
database_id = "6d3a035f-b869-4e1f-af61-bb34f2f5c51c"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *", "7,22,37,52 * * * *"]

# Server logs (Workers Logs), so errors and slow requests can be looked into. Logs hold request paths and
# Relay's own console lines, which never include tokens or email text.
[observability]
enabled = true
head_sampling_rate = 1
