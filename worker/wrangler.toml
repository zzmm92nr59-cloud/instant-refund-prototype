name = "relay-square-api2"
main = "worker.js"
compatibility_date = "2026-10-07"
workers_dev = true

# Not secret. Kept here because plain-text variables added in the Cloudflare dashboard
# are removed on every deploy (secrets are kept).
[vars]
SHOPIFY_SHOP_DOMAIN = "relay-ltd.myshopify.com"
AWIN_PUBLISHER_ID = "3134429"
# Relay's app registration with Microsoft (personal accounts only). The matching MICROSOFT_CLIENT_SECRET is a Cloudflare secret.
MICROSOFT_CLIENT_ID = "08207e63-9ef5-4a9c-ba4d-528e35f4c92a"
# The prototype's test-only endpoints (worker/legacy-routes.js). "on" only for a testing session, then back to "off".
LEGACY_TEST_ROUTES = "off"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "relay-purchase-ledger"
database_id = "6d3a035f-b869-4e1f-af61-bb34f2f5c51c"
migrations_dir = "migrations"

# Relay's D1 database is in Eastern North America, so from London each database call crosses the Atlantic. Pinning the
# Worker to aws:us-east-1 was tried (3 Nov 2026) and measured slower: requests gained about 80 ms each and database calls
# didn't get quicker. Smart Placement moves the Worker only where Cloudflare measures it running faster, so it can't
# make things worse.
[placement]
mode = "smart"

# Rate limits (worker/limits.js explains each). Cloudflare counts these per location, approximately; each namespace_id is
# just a number naming that counter within Relay's Cloudflare account. Changing a limit here and deploying is all it takes.
[[ratelimits]]
name = "RL_IP"
namespace_id = "7301"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "RL_SIGNIN"
namespace_id = "7302"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_USER"
namespace_id = "7303"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_MAIL"
namespace_id = "7304"
simple = { limit = 60, period = 60 }

[triggers]
# Hourly: shops, price alerts, reminders. Every 15 minutes: new mail. Every minute: scans carried on after the shopper left the app.
crons = ["0 * * * *", "7,22,37,52 * * * *", "* * * * *"]

# Server logs (Workers Logs), so errors and slow requests can be looked into. Logs hold request paths and
# Relay's own console lines, which never include tokens or email text.
[observability]
enabled = true
head_sampling_rate = 1
